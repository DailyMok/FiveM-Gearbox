<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gearbox HUD</title><link rel="stylesheet" href="style.css"></head>
<body><div id="race-banner" hidden><aside id="f1-status" aria-label="Speed and current gear">
<div id="gear-instrument" class="gear-instrument" aria-label="Current gear"><span id="shift-arrow" aria-label="Shift advice" hidden></span><strong id="gear">—</strong><span id="gear-mode">AUTO</span></div>
<div class="speed-instrument"><strong id="speed">0</strong><span>KM/H</span></div>
</aside></div><script src="app.js"></script><script src="gear-sound.js"></script></body></html>
